<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Saybread Giveaway Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<script>window.onerror=function(m,s,l){var d=document.getElementById('main');if(d)d.innerHTML='<h1>Terjadi kesalahan</h1><p>'+m+' (baris '+l+')</p>'}</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6efe2;--pn:#fffaf0;--ink:#3b2416;--mut:#7a6552;--ln:#e0d2bb;--br:#4a2c1a;--bi:#fffaf0;--red:#a8453a;--ok:#4d6b3a;--wn:#9a6a1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#21140d;--pn:#2c1b11;--ink:#f1e6d2;--mut:#b49c80;--ln:#47301f;--br:#120a05;--bi:#f1e6d2;--red:#d4766b;--ok:#9bbd84;--wn:#d9a74f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#21140d;--pn:#2c1b11;--ink:#f1e6d2;--mut:#b49c80;--ln:#47301f;--br:#120a05;--bi:#f1e6d2;--red:#d4766b;--ok:#9bbd84;--wn:#d9a74f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0 0 .6rem}h1{font-size:2rem}h2{font-size:1.25rem;margin-top:1.8rem}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--br);color:var(--bi);padding:1.2rem .9rem;position:sticky;top:0;height:100vh;overflow:auto}
aside b{font:700 1.15rem Fraunces,Georgia,serif;display:block;margin-bottom:1rem}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:.55rem .7rem;border-radius:6px;font:inherit;cursor:pointer;opacity:.8}
#nav button.on,#nav button:hover{background:rgba(255,250,240,.14);opacity:1}
aside select{width:100%;margin-top:1rem}
main{padding:1.6rem clamp(1rem,3vw,2.5rem);max-width:1100px;width:100%}
.mut{color:var(--mut)}.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:1rem 1.2rem;margin:.8rem 0}
.stats{display:flex;gap:.8rem;flex-wrap:wrap}.st{flex:1 1 150px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:.8rem 1rem;color:var(--mut)}.st b{display:block;font:700 1.9rem Fraunces,Georgia,serif;color:var(--ink)}
button,.btn{font:inherit;border:1px solid var(--br);background:var(--br);color:var(--bi);padding:.45rem .9rem;border-radius:6px;cursor:pointer}
button.g{background:none;color:var(--ink);border-color:var(--ln)}button.r{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--wn);outline-offset:2px}
input,select,textarea{font:inherit;background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:.4rem .6rem;width:100%}
label{display:block;font-weight:600;margin:.6rem 0 .2rem}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1rem}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mut);font-weight:600}
.Benar{color:var(--ok)}.Salah{color:var(--mut)}.Tinjau{color:var(--wn)}.drop{border:2px dashed var(--ln);border-radius:8px;padding:1.4rem;text-align:center;color:var(--mut)}.drop.h{border-color:var(--wn)}
.win{border-left:4px solid var(--red);padding:.5rem 1rem;margin:.5rem 0;background:var(--pn);font:700 1.3rem Fraunces,Georgia,serif}
#tst{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--br);color:var(--bi);padding:.6rem 1rem;border-radius:8px;max-width:90vw;display:none;z-index:9}
.wheel{text-align:center;margin:1rem 0}.wheel canvas{width:min(88vw,380px);height:auto;aspect-ratio:1}.wheel .row{justify-content:center}@media(max-width:760px){.app{display:block}body{font-size:16px}aside{position:sticky;top:0;z-index:5;height:auto;padding:.5rem .7rem;display:flex;flex-direction:column;gap:.4rem}aside b{margin:0;font-size:1rem}#nav{display:flex;overflow-x:auto;gap:.2rem}#nav button{width:auto;white-space:nowrap;padding:.65rem .9rem;min-height:44px}aside select{margin:0;min-height:44px}main{padding:1rem .9rem 5rem}input,select,textarea,button{min-height:44px;font-size:16px}.row>*{flex:1 1 100%}h1{font-size:1.6rem}.st{flex:1 1 40%}.win{font-size:1.15rem}}
@media print{aside,#tst{display:none}}
</style></head><body><div class="app"><aside><b>Saybread Giveaway Manager</b><nav id="nav"></nav><select id="ksel" aria-label="Kuis aktif"></select></aside><main id="main"><p>Memuat aplikasi… Jika tulisan ini tidak hilang, skrip tidak berjalan di browser ini.</p></main></div><div id="tst" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='saybread-gm-v1';let S={projects:[],cur:null};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan: penyimpanan browser penuh atau diblokir. Unduh backup di Pengaturan.')}};
let tt;const toast=m=>{const t=$('#tst');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',6000)};
const P0=()=>S.projects.find(x=>x.id===S.cur),A={};let V='dash',U={q:'',f:'all'},IMP=null,DR=null,RV=0,NF=null,DEL=null,TM;
const NAV=[['dash','Dashboard'],['new','Buat Kuis'],['data','Data Komentar'],['valid','Peserta Valid'],['draw','Undian'],['hist','Riwayat Undian'],['set','Pengaturan']];
const norm=t=>String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const nu=u=>String(u||'').trim().replace(/^@/,'').toLowerCase().replace(/\s+/g,'');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function judge(p,t){const n=norm(t),L=[p.answer,...String(p.alts||'').split(/[,\n]/)].map(norm).filter(Boolean);
if(!L.length)return['Salah','Jawaban benar belum diisi'];if(L.includes(n))return['Benar','Sama persis dengan jawaban yang diterima (setelah huruf besar, spasi, dan tanda baca dinormalkan)'];
if(p.flex)for(const a of L)if((' '+n+' ').includes(' '+a+' '))return['Benar','Kalimat memuat jawaban “'+a+'”'];
return['Salah','Tidak cocok dengan jawaban yang diterima']}
const eff=c=>c.manual||c.status,tag=s=>`<span class="${s=='Perlu Ditinjau'?'Tinjau':s}">${s}</span>`;
function pool(p){const ex=new Set((p.excluded||[]).map(nu)),ok=p.comments.filter(c=>eff(c)=='Benar'&&!ex.has(nu(c.user))).sort((a,b)=>(Date.parse(a.ts)||0)-(Date.parse(b.ts)||0));
if(p.mode=='B')return ok;const m=new Map();for(const c of ok){const k=nu(c.user);if(!m.has(k)||p.pick=='last')m.set(k,c)}return[...m.values()]}
const rnd=n=>{const m=Math.floor(2**32/n)*n,a=new Uint32Array(1);do crypto.getRandomValues(a);while(a[0]>=m);return a[0]%n};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const log=(p,m)=>p.log.push([new Date().toISOString(),m]);const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const need=P=>P?'':'<p class="mut">Pilih atau buat kuis terlebih dahulu.</p>';const fd=t=>t?new Date(t).toLocaleString('id-ID'):'';
function mk(o={}){return{id:'p'+Date.now(),name:'',edition:'',url:'',start:'',end:'',desc:'',answer:'',alts:'',n:3,prize:'',mode:'A',pick:'first',flex:true,rv:1,comments:[],excluded:[],log:[],draws:[],...o}}
const fld=(k,l,v,t='text')=>`<div><label for="f_${k}">${l}</label><input id="f_${k}" name="${k}" type="${t}" value="${esc(v)}"></div>`;
const sel=(k,v,o)=>`<select name="${k}" id="f_${k}">${o.map(([a,b])=>`<option value="${a}" ${a==v?'selected':''}>${b}</option>`).join('')}</select>`;
const ruleBox=p=>`<div class="grid"><div><label for="f_mode">Aturan peserta</label>${sel('mode',p.mode,[['A','A: satu akun, satu kesempatan'],['B','B: satu komentar, satu kesempatan']])}</div><div><label for="f_pick">Komentar yang dipakai (mode A)</label>${sel('pick',p.pick,[['first','Benar pertama'],['last','Benar terakhir']])}</div><div><label for="f_flex">Pencocokan</label>${sel('flex',String(p.flex),[['false','Harus sama persis dengan jawaban'],['true','Kalimat yang memuat jawaban dianggap benar']])}</div></div>`;
const VIEWS={
dash(){const R=S.projects.filter(x=>!x.demo),n=f=>R.reduce((a,x)=>a+f(x),0),last=R[R.length-1],dr=R.flatMap(x=>x.draws.map(d=>({...d,q:x.name}))).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,5);
return`<h1>Dashboard</h1>${R.length?'':'<p class="mut">Belum ada kuis sungguhan. Mulai dari Buat Kuis. Data demo tidak dihitung di sini.</p>'}<div class="stats">${[['Total kuis',R.length],['Komentar diimpor',n(x=>x.comments.length)],['Peserta unik',n(x=>new Set(x.comments.map(c=>nu(c.user))).size)],['Peserta valid',n(x=>pool(x).length)]].map(([l,v])=>`<div class="st"><b>${v}</b>${l}</div>`).join('')}</div><h2>Kuis terakhir</h2>${last?`<div class="card"><b>${esc(last.edition)} ${esc(last.name)}</b><br><span class="mut">${last.comments.length} komentar, ${last.draws.length} undian</span><br><button class="g" data-a="open" data-v="${last.id}">Buka</button></div>`:'<p class="mut">Belum ada.</p>'}<h2>Undian terbaru</h2>${dr.length?tbl(['Waktu','Kuis','Pemenang'],dr.map(d=>[fd(d.time),esc(d.q),d.winners.map(w=>'@'+esc(w.user)).join(', ')])):'<p class="mut">Belum ada undian.</p>'}`},
new(){const p=NF||mk();return`<h1>${NF?'Kuis baru dari salinan':'Buat Kuis'}</h1><p class="mut">Setiap kuis adalah proyek terpisah. ${NF?'Komentar dan hasil undian kuis lama tidak ikut disalin.':''}</p><form id="nf" class="card"><div class="grid">${fld('name','Nama kuis',p.name)}${fld('edition','Nomor edisi (mis. Bread the Code #01)',p.edition)}${fld('url','URL postingan Instagram (hanya metadata)',p.url,'url')}${fld('start','Tanggal mulai',p.start,'date')}${fld('end','Batas akhir partisipasi',p.end,'date')}${fld('n','Jumlah pemenang',p.n,'number')}${fld('prize','Hadiah',p.prize)}${fld('answer','Jawaban benar',p.answer)}</div><label for="f_alts">Alternatif jawaban yang diterima (pisahkan dengan koma)</label><input id="f_alts" name="alts" value="${esc(p.alts)}"><label for="f_desc">Deskripsi</label><textarea id="f_desc" name="desc" rows="2">${esc(p.desc)}</textarea>${ruleBox(p)}<p><button type="button" data-a="create">Simpan kuis</button></p></form>`},
data(P){if(!P)return need(P);const q=norm(U.q),L=P.comments.filter(c=>(U.f=='all'||eff(c)==U.f)&&(!q||norm(c.user+' '+c.text).includes(q)));const m=IMP?.map;
const so=k=>`<select data-c="map" data-v="${k}"><option value="-1">(tidak ada)</option>${IMP.h.map((h,i)=>`<option value="${i}" ${m[k]==i?'selected':''}>${esc(h)}</option>`).join('')}</select>`;
return`<h1>Data Komentar</h1><div class="card"><div class="drop" id="dz">Seret file CSV, XLSX, atau JSON ke sini<br><input type="file" id="fi" accept=".csv,.tsv,.txt,.xlsx,.xls,.json" aria-label="Pilih file"></div><label for="pa">Atau tempel data tabel (CSV atau hasil salin dari Excel)</label><textarea id="pa" rows="3" placeholder="username,comment,timestamp"></textarea><p><button class="g" data-a="paste">Proses tempelan</button></p>
${IMP?`<h2>Pratinjau ${esc(IMP.name)}</h2><p class="mut">${IMP.rows.length} baris terbaca. Cocokkan kolom jika perlu.</p><div class="grid"><div><label>Username</label>${so('user')}</div><div><label>Komentar</label>${so('text')}</div><div><label>Waktu</label>${so('ts')}</div><div><label>ID</label>${so('id')}</div></div>${tbl(IMP.h.map(esc),IMP.rows.slice(0,5).map(r=>r.map(esc)))}<p><button data-a="doImport" ${m.user<0||m.text<0?'disabled':''}>Impor ke kuis ini</button> <button class="g" data-a="cancel">Batal</button></p>`:''}</div>
<div class="row"><input data-i="q" value="${esc(U.q)}" placeholder="Cari username atau komentar" aria-label="Cari" style="max-width:280px"><select data-c="f" style="max-width:200px">${['all','Benar','Salah'].map(f=>`<option ${f==U.f?'selected':''}>${f}</option>`).join('')}</select><span class="mut">${L.length} dari ${P.comments.length}</span></div>
${tbl(['Username','Komentar','Status','Alasan','Ubah'],L.slice(0,200).map(c=>[esc(c.user),esc(c.text),tag(eff(c))+(c.manual?' (manual)':''),esc(c.manual?'Diubah manual, otomatis: '+c.status:c.reason),`<select data-c="st" data-v="${c.id}|${P.comments.indexOf(c)}"><option value="">Otomatis</option>${['Benar','Salah'].map(s=>`<option ${c.manual==s?'selected':''}>${s}</option>`).join('')}</select>`]))}${L.length>200?'<p class="mut">Menampilkan 200 pertama. Persempit dengan pencarian.</p>':''}`},
valid(P){if(!P)return need(P);const pl=pool(P);
return`<h1>Peserta Valid</h1><p>${pl.length} entri memenuhi syarat.</p>${P.mode=='B'?'<p class="Tinjau">Mode B: satu akun bisa punya beberapa kesempatan, tetapi tetap hanya bisa menang satu hadiah.</p>':''}
<div class="card"><b>Aturan kuis</b><div id="rb"><label for="f_answer">Jawaban benar</label><input id="f_answer" name="answer" value="${esc(P.answer)}"><label for="f_alts">Alternatif</label><input id="f_alts" name="alts" value="${esc(P.alts)}">${ruleBox(P)}</div><p><button class="g" data-a="rules">Terapkan aturan dan validasi ulang</button> <span class="mut">Status manual tidak ditimpa.</span></p></div>
<div class="card"><label for="ex">Kecualikan username (akun sendiri atau tim penyelenggara)</label><div class="row"><input id="ex" placeholder="@username" style="max-width:260px"><button class="g" data-a="exclude" data-v="">Kecualikan</button></div>${(P.excluded||[]).map(u=>`<span class="mut">@${esc(u)} <button class="g" data-a="unex" data-v="${esc(u)}">Batalkan</button></span> `).join('')}</div>
${tbl(['Username','Komentar','Waktu',''],pl.slice(0,300).map(c=>[esc(c.user),esc(c.text),esc(c.ts),`<button class="g" data-a="exclude" data-v="${esc(c.user)}">Kecualikan</button>`]))}<h2>Riwayat perubahan</h2>${P.log.length?tbl(['Waktu','Perubahan'],P.log.slice(-30).reverse().map(l=>[fd(l[0]),esc(l[1])])):'<p class="mut">Belum ada.</p>'}`},
draw(P){if(!P)return need(P);const pl=pool(P),us=new Set(pl.map(c=>nu(c.user))).size,ex=P.comments.filter(c=>(P.excluded||[]).map(nu).includes(nu(c.user))).length;
const d=DR&&DR.q==P.id?DR:null;
return`<h1>Undian</h1><div class="stats">${[['Komentar',P.comments.length],['Username unik',new Set(P.comments.map(c=>nu(c.user))).size],['Jawaban benar',P.comments.filter(c=>eff(c)=='Benar').length],['Entri memenuhi syarat',pl.length],['Komentar dikecualikan',ex],['Pemenang dipilih',Math.min(P.n,us)]].map(([l,v])=>`<div class="st"><b>${v}</b>${l}</div>`).join('')}</div>
${us<P.n?`<p class="Tinjau">Peserta unik (${us}) lebih sedikit dari jumlah hadiah (${P.n}). Hanya ${us} pemenang yang bisa dipilih.</p>`:''}<p class="mut">Tinjau daftar di Peserta Valid sebelum mengundi. Hasil undian tersimpan dan tidak bisa diubah diam-diam.</p>
<div class="row"><input id="note" placeholder="Catatan pengundian (opsional)" style="min-width:260px"><button class="r" data-a="start" ${us?'':'disabled'}>Mulai Undian</button></div>
${d?`<h2>Pemenang</h2>${RV<d.winners.length?`<div class="wheel"><canvas id="wc" width="720" height="720" role="img" aria-label="Roda undian"></canvas><p>Hadiah ${RV+1} dari ${d.winners.length}</p><div class="row"><button class="r" data-a="spin">Putar roda</button><button class="g" data-a="skip">Lewati animasi</button></div><details><summary>Semua nama di roda</summary><p class="mut" id="wn"></p></details></div>`:''}<div id="wl">${d.winners.slice(0,RV).map((w,i)=>`<div class="win">${i+1}. @${esc(w.user)}</div>`).join('')}${RV>=d.winners.length?`<p class="mut">Selesai. Rincian ada di Riwayat Undian.</p>`:''}</div>`:''}
<p class="mut">Sumber acak: crypto.getRandomValues. Roda hanya animasi: pemenang sudah ditentukan lebih dulu oleh pengundian acak tersebut. Pencatatan ini membantu audit, tetapi tidak otomatis membuktikan keadilan jika data atau aturan sebelum undian bisa diubah.</p>`},
hist(P){const dr=S.projects.flatMap(x=>x.draws.map(d=>({...d,pn:x.name,demo:x.demo}))).sort((a,b)=>b.time.localeCompare(a.time));
return`<h1>Riwayat Undian</h1><h2>Semua kuis</h2>${S.projects.length?tbl(['Kuis','Komentar','Undian',''],S.projects.map(x=>[esc((x.demo?'[DEMO] ':'')+x.edition+' '+x.name),x.comments.length,x.draws.length,`<button class="g" data-a="open" data-v="${x.id}">Buka</button> <button class="g" data-a="dup" data-v="${x.id}">Gandakan</button> <button class="${DEL==x.id?'r':'g'}" data-a="del" data-v="${x.id}">${DEL==x.id?'Yakin hapus?':'Hapus'}</button>`])):'<p class="mut">Belum ada kuis.</p>'}
<h2>Undian tersimpan</h2>${dr.map(d=>`<div class="card"><b>${esc(d.pn)}</b>${d.demo?' (demo)':''}<br><span class="mut">${fd(d.time)}, ${d.poolN} entri dari ${d.users} akun, hash ${d.hash.slice(0,12)}</span><br>${d.winners.map(w=>'@'+esc(w.user)).join(', ')}${d.note?'<br>Catatan: '+esc(d.note):''}</div>`).join('')||'<p class="mut">Belum ada.</p>'}
<h2>Ekspor kuis aktif</h2>${P?`<div class="row">${[['all','Semua komentar CSV'],['valid','Peserta valid CSV'],['validx','Peserta valid XLSX'],['bad','Tidak valid CSV'],['win','Pemenang CSV'],['winx','Pemenang XLSX'],['rep','Laporan HTML']].map(([k,l])=>`<button class="g" data-a="exp" data-v="${k}">${l}</button>`).join('')}</div>`:need(P)}`},
set(){return`<h1>Pengaturan</h1><div class="card"><b>Lokasi data</b><p>Semua data tersimpan di penyimpanan browser Anda pada perangkat ini dan tidak dikirim ke server mana pun. Data bisa hilang jika browser dibersihkan atau perangkat berganti, jadi unduh backup secara berkala.</p><div class="row"><button data-a="backup">Unduh backup</button><input type="file" id="rs" accept=".json" aria-label="Pilih backup"></div><p class="mut">Restore menambahkan kuis yang belum ada dan tidak menimpa kuis dengan ID sama.</p></div>
<div class="card"><b>Instagram Graph API: belum terhubung</b><p>Aplikasi ini tidak mengambil komentar langsung dari Instagram. URL postingan hanya disimpan sebagai catatan. Akses resmi memerlukan akun Business atau Creator, izin dan token yang sesuai, serta backend untuk menyimpan kredensial, dan belum disiapkan di versi ini. Gunakan impor file.</p></div>
<div class="card"><b>Data demo</b><p>Kuis demo berisi komentar contoh untuk uji coba, ditandai [DEMO] dan tidak dihitung di Dashboard.</p><button class="g" data-a="demo">Buat kuis demo</button></div>`}};
function render(){const P=P0();$('#nav').innerHTML=NAV.map(([k,l])=>`<button data-a="go" data-v="${k}" class="${V==k?'on':''}">${l}</button>`).join('');
$('#ksel').innerHTML='<option value="">Pilih kuis</option>'+S.projects.map(x=>`<option value="${x.id}" ${x.id==S.cur?'selected':''}>${esc((x.demo?'[DEMO] ':'')+(x.name||'Tanpa nama'))}</option>`).join('');$('#main').innerHTML=VIEWS[V](P);bind()}
